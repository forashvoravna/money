<!DOCTYPE html>
<html lang="en"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity3"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Creative - Bootstrap 3 Responsive Admin Template">
  <meta name="author" content="GeeksLabs">
  <meta name="keyword" content="Creative, Dashboard, Admin, Template, Theme, Bootstrap, Responsive, Retina, Minimal">

  <title>Login Sahifasi</title>

  <!-- Bootstrap CSS -->
  <link  th:href="@{/css/bootstrap.min.css}" type="text/css" media="all" rel="stylesheet">
  <!-- bootstrap theme -->
  <link th:href="@{/css/bootstrap-theme.css}" type="text/css" media="all" rel="stylesheet">
  <!--external css-->
  <link th:href="@{/css/elegant-icons-style.css}" type="text/css" media="all" rel="stylesheet" />
  <link th:href="@{/css/font-awesome.css}" type="text/css" media="all" rel="stylesheet" />
  <!-- Custom styles -->
  <link th:href="@{/css/style.css}" type="text/css" media="all"  rel="stylesheet">
  <link th:href="@{/css/style-responsive.css}" type="text/css" media="all" rel="stylesheet" />

</head>

<body class="login-img3-body">

  <div class="container">

    <form class="login-form" th:action="@{/api/login}" method="post">
      <div class="login-wrap">
        <p class="login-img"><i class="icon_lock_alt"></i></p>
        <div class="input-group">
          <span class="input-group-addon"><i class="icon_profile"></i></span>
          <input type="text" name="username"  class="form-control" placeholder="Foydalanuvchi" autofocus>
        </div>
        <div class="input-group">
          <span class="input-group-addon"><i class="icon_key_alt"></i></span>
          <input type="password" name="password" class="form-control" placeholder="Parol">
        </div>

        <button class="btn btn-primary btn-lg btn-block" type="submit">Kirish</button>
      </div>
    </form>
    <div class="text-right">
      <div class="credits">
          Designed by M_Rajabov
        </div>
    </div>
  </div>

  <script type="text/javascript" th:src="@{/js/html5shiv.js}" src="/js/html5shiv.js"></script>
<!--  <script type="text/javascript" th:src="@{/js/respond.min.js}" src="../static/js/respond.min.js" ></script>-->

</body>

</html>
