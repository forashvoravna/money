<!DOCTYPE html>
<html lang="en" xmlns:sec="http://www.w3.org/1999/xhtml">
<html xmlns:th="http://www.thymeleaf.org">
<meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1"/>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Creative - Bootstrap 3 Responsive Admin Template">
    <meta name="author" content="GeeksLabs">
    <meta name="keyword" content="Creative, Dashboard, Admin, Template, Theme, Bootstrap, Responsive, Retina, Minimal">

    <title>HarajatIndex</title>

    <link th:href="@{/css/bootstrap.min.css}" href="../static/css/bootstrap.min.css" type="text/css" media="all"
          rel="stylesheet">
    <link th:href="@{/css/bootstrap-theme.css}" href="../static/css/bootstrap-theme.css" type="text/css" media="all"
          rel="stylesheet">
    <link th:href="@{/css/elegant-icons-style.css}" href="../static/css/elegant-icons-style.css" type="text/css"
          media="all" rel="stylesheet">
    <link th:href="@{/css/font-awesome.css}" href="../static/css/font-awesome.css" type="text/css" media="all"
          rel="stylesheet">
    <link th:href="@{/css/style.css}" href="../static/css/style.css" rel="stylesheet" type="text/css">
    <style>
        .row-harajat {
            background-color: #ffffd8; /* Sariq */
            color: #d7a12e;
        }
    </style>
</head>

<body>
<!------------------------ container section start -------------------->
<section id="container" class="">
    <header class="header dark-bg">

        <!-------------------------logo start--------------------------->
        <a href="/api/money/sahifa/getAll" class="logo">Umumiy Holat</a>
        <!--------------------------logo end-------------------------->

        <!---------------- notificatoin dropdown start---------------->
        <div class="top-nav notification-row">
            <ul class="nav pull-right top-menu">
                <li class="dropdown">
                    <a data-toggle="dropdown" class="dropdown-toggle" href="#">
                            <span class="profile-ava">
                              <i class="icon_profile"> </i>
                            </span>
                        <!--                                                <span class="username" th:text="${user.fullName}"></span>-->
                        <b class="caret"></b>
                    </a>
                    <ul class="dropdown-menu extended logout">
                        <div class="log-arrow-up"></div>
                        <li>
                            <a href="/../api/login"> <i class="icon_key_alt"></i> Tizimdan chiqish</a>
                        </li>
                        <li sec:authorize="hasRole('ADMIN')">
                            <a class="" href="/api/admin/user/getAll">
                                <i class="icon_profile"></i>
                                <span> Foydalanuvchi </span>
                            </a>
                        </li>
                    </ul>
                </li>
                <!----------------------------------user login dropdown end ----------------------------------------->
            </ul>
        </div>
    </header>
    <!------------------------------------------header end----------------------------------------------->

</section>
<!-------------------------------  container section end   ----------------------------------------->

<!-------------------------------  main content start      ----------------------------------------->
<section id="main-content">
    <section class="wrapper">

        <!------------------overview start--------------------------->
        <div class="row">
            <div class="col-lg-12">
                <a href="/api/money/harajat/getAll" class="page-header" style="display: block; color: gray;"><i
                        class="fa fa-laptop"></i> Harajat holati</a>
            </div>
        </div>
        <!---------------overview start---------------------->

        <!----------------info-box start----------------->
        <div class="row">
            <div class="col-lg-6 ">
                <div class="info-box lime-bg" style="border-radius:10px">
                    <i class="fa fa-university"></i>
                    <div class="count"><span th:text="${money}"> </span></div>
                    <div class="title">Fond holati</div>
                </div>
            </div>
            <!----------------/.info-box----------------->


            <div class="col-lg-6 ">
                <div class="info-box yellow-bg" style="border-radius:10px">
                    <i class="fa fa-shopping-cart"></i>
                    <div class="count"><span th:text="${harajat}"> </span></div>
                    <div class="title"> Umumiy harajat</div>
                </div>
            </div>
        </div>
        <!-------------------/.col---------------------->


        <!-- -------------       jadvalni boshlanishi       ---------------------->
        <div class="row">
            <div class="col-lg-12">
                <h3 class="page-header"><i class="fa fa-table"></i> Harajatlar jadvali</h3>
            </div>
        </div>

        <!------------------qidiruv qismi boshlanishi---------------------------->
        <div>
            <form th:action="@{/api/money/harajat/getAll}" method="post" class="col-lg-6">
                <div class="row">
                    <div class="col-lg-6">
                        <input type="text" name="fullName" th:value="${fullName}" class="form-control input"
                               placeholder="qidirish">
                    </div>
                    <div class="col-lg-6">
                        <div style="display: inline-block">
                            <button type="submit" class="btn btn-info">Qidirish</button>
                        </div>
                    </div>
                </div>
            </form>
        </div>

        <br>
        <br>
        <!------------------qidiruv qismi tugashi---------------------------->

        <!----------------jadvalni o'zini ko'rinishi--------------------------->

        <div class="row">
            <div class="col-lg-12">
                <section class="panel">

                    <header class="panel-heading">
                        <div class="col-lg-6" style="display: inline-block">
                            Umumiy jadval
                        </div>

                        <div class="col-lg-6" style="display: inline-block">
                            <form>
                                <a th:href="@{/api/money/harajat/export/excel}" class="btn btn-info"> <span
                                        class="fa fa-download">Excelga yuklash</span></a>
                            </form>
                        </div>
                    </header>

                    <div class="panel-body" style="overflow-x:auto">
                        <table class="table table-bordered">
                            <thead class="bg-dark">
                            <tr>
                                <th class="text-center"><i class="icon_id"></i> T/R</th>
                                <th class="text-center"><i class="icon_drawer"></i> Turi</th>
                                <th class="text-center"><i class="icon_documents"></i> Izoh</th>
                                <th class="text-center"><i class="fa fa-dollar"></i> Qiymat</th>
                                <th class="text-center"><i class="fa fa-clock-o"></i> Yaratilgan vaqti</th>
                                <th class="text-center"><i class="fa fa-clock-o"></i> Yangilangan vaqti</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="harajat,row :${harajatList}" th:class="row-harajat">
                                <td th:text="${row.index + 1}" class="text-center"></td>
                                <td th:text="${harajat.moneyType}" class="text-center"></td>
                                <td th:text="${harajat.description}" class="text-center"></td>
                                <td th:text="${harajat.quantity}" class="text-center"></td>
                                <td th:text="${harajat.created_at}" class="text-center"></td>
                                <td th:text="${harajat.updated_at}" class="text-center"></td>
                            </tr>
                            </tbody>
                        </table>
                        <hr/>

                    </div>
                </section>
            </div>
        </div>
    </section>
</section>
<script th:src="@{/js/jquery.js}" src="../static/js/jquery.js"></script>
<script th:src="@{/js/bootstrap.min.js}" src="../static/js/bootstrap.min.js"></script>
<script th:src="@{/js/jquery.nicescroll.js}" src="../static/js/jquery.nicescroll.js"></script>
<script th:src="@{/js/scripts.js}" src="../static/js/scripts.js"></script>
</body>
</html>
